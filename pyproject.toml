[project]
name = "cefi-mcp"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aiofiles>=24.1.0",
    "aiohttp>=3.12.13",
    "async-lru>=2.0.5",
    "fastmcp>=2.10.1",
    "loguru>=0.7.3",
    "netcdf4>=1.7.2",
    "numpy>=2.2.6",
    "pydantic>=2.11.7",
    "pydap>=3.5.5",
    "pytest-asyncio>=1.0.0",
    "xarray>=2025.6.1",
]

[dependency-groups]
dev = [
  "pytest>=8.4.0",
  "ruff>=0.11.12",
]

[project.scripts]
cefi-mcp = "cefi_mcp:main"

[build-system]
requires = ["uv_build>=0.7.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src/"
module-name = "cefi_mcp"

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "C4", "UP", "PL", "RUF"]
ignore = ["PLR2004", "PLR0912", "PLR0913", "B028"]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "F403", "F405"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"
